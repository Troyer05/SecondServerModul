}

MAP_OBJECT(_config AS _key, _value) {
    OUTPUT(_key);
    LOG(_value);
}

F restartable(_counter) {
    IF (_counter < 1) {
        this_f.restart();
    }
    BACK _counter;
}

CLASS DemoService {
    PRIV DECLARE _name = "DemoService";

    PUB F boot(_input) {
        BACK this._name;
    }
}

