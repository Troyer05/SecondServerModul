DECLARE _last_user = last_added($demo_base, $demo_table);
DECLARE _last_user_alias = last_data($demo_base, $demo_table);

OUTPUT "Runtime-Datenfunktionen:";
OUTPUT _all_users;
OUTPUT ["count_data": _user_count, "tally_data": _user_count_alias];
OUTPUT ["last_added": _last_user, "last_data": _last_user_alias];

DECLARE _runtime_insert = add_data($demo_base, $demo_table, ["uid": "u004", "username": "Margaret", "email": "margaret@example.test", "password": hash_sha256("margaret-secret"), "active": true, "created_at": NOW, "last_login": "", "role": "scientist", "note": "inserted by add_data", "score": 90, "login_count": 1, "tags": "demo,science"]);
DECLARE _runtime_insert_alias = seed_data($demo_base, $demo_table, ["uid": "u005", "username": "Katherine", "email": "katherine@example.test", "password": hash_sha256("katherine-secret"), "active": true, "created_at": NOW, "last_login": "", "role": "scientist", "note": "inserted by seed_data", "score": 95, "login_count": 1, "tags": "demo,science"]);
DECLARE _runtime_insert_alias_2 = plant_data($demo_base, $demo_table, ["uid": "u006", "username": "Hedy", "email": "hedy@example.test", "password": hash_sha256("hedy-secret"), "active": true, "created_at": NOW, "last_login": "", "role": "inventor", "note": "inserted by plant_data", "score": 85, "login_count": 1, "tags": "demo,inventor"]);

OUTPUT ["add_data": _runtime_insert, "seed_data": _runtime_insert_alias, "plant_data": _runtime_insert_alias_2];

DECLARE _runtime_edit = edit_data($demo_base, $demo_table, ["note": "edited by edit_data", "score": 96], ["uid": "u005"]);
DECLARE _runtime_edit_alias = reshape_data($demo_base, $demo_table, ["note": "edited by reshape_data", "score": 86], ["uid": "u006"]);

OUTPUT ["edit_data": _runtime_edit, "reshape_data": _runtime_edit_alias];

DECLARE _runtime_delete = delete_data($demo_base, $demo_table, ["uid": "u004"]);
