# Rechte-/Engine-Schlüsselwörter
# ============================================================
# Diese Befehle sind je nach Engine-Implementierung evtl. reine Demo- oder
# Admin-Features. Wenn sie bei dir aktiv sind, kannst du sie einkommentieren.
