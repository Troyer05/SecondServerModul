# ============================================================
# Delete / Index / Constraint Cleanup innerhalb der Demo-Tabelle
# ============================================================

DELETE FROM users WHERE uid="u002";
ERASE FROM users WHERE uid="u003";

UNINDEX users uid;
UNINDEX users username;

ALTER TABLE users DROP CONSTRAINT UNIQUE uid;
ALTER TABLE users DROP CONSTRAINT REQUIRED username;

REPAIR users;
CHECK users;

DECLARE _after_delete_rows = fetch_data($demo_base, $demo_table, []);
OUTPUT "Nach DELETE / ERASE:";
OUTPUT _after_delete_rows;

LOG(["after_delete_rows": _after_delete_rows]);

# ============================================================
# Optional: Logdatei löschen
# ============================================================

IF (_delete_log) {
    DELETE_LOG_FILE();
    OUTPUT "Logdatei wurde gelöscht.";
} ELSE {
    OUTPUT "Logdatei bleibt erhalten.";
}

# ============================================================
# Optional: Demo-System aufräumen
# ============================================================
# Cleanup löscht nur die Showcase-Strukturen.
# Standard ist false, damit man nach dem Script die Ergebnisse ansehen kann.
# ============================================================

IF (_cleanup) {
    DROP TABLE users_archive;
    DROP TABLE users;
    DROP BASE gql_showcase_main;
    DROP INSTANCE gql_showcase FORCE;
    OUTPUT "Cleanup wurde ausgeführt.";
} ELSE {
    OUTPUT "Cleanup wurde übersprungen.";
}

# ============================================================
# Rückgabe
# ============================================================

DECLARE _return_rows = fetch_data($demo_base, $demo_table, []);
DECLARE _return_count = count_data($demo_base, $demo_table, []);

FILE.BACK [
    "ok": true,
    "instance": $demo_instance,
    "base": $demo_base,
    "table": $demo_table,
    "rows": _return_rows,
    "count": _return_count,
    "cleanup": _cleanup,
    "delete_log": _delete_log
];

