# ============================================================
# Eigene Funktion
# ============================================================

F make_label(_prefix, _name) {
    DECLARE _text = _prefix + ": " + _name;
    BACK _text;
}

F safe_score_label(_name, _score) {
    IF (_score >= 90) {
        BACK _name + " ist Top-Level";
    } ELSE {
        BACK _name + " ist Normal-Level";
    }
}

DECLARE _label = CALL make_label("Aktiver User", _input_name);
DECLARE _score_label = CALL safe_score_label(_input_name, 100);

OUTPUT _label;
OUTPUT _score_label;

LOG(_label);
LOG(_score_label);

# ============================================================
# Schleifen
# ============================================================

FOR (_i = 0; _i < 3; _i++) {
    OUTPUT "FOR loop index " + _i;
    LOG(["loop": _i]);
}

DECLARE _profile = ["name": _input_name, "role": "admin", "active": true, "score": 100];

MAP_OBJECT(_profile AS _key, _value) {
    OUTPUT "MAP_OBJECT " + _key + " = " + _value;
    LOG(["map_key": _key, "map_value": _value]);
}

# ============================================================
# Klasse / Methode / this
# ============================================================

C ShowcaseHelper {
    PUB DECLARE _prefix = "ShowcaseHelper";

    PUB F describe(_name, _count) {
        DECLARE _text = this._prefix + " => " + _name + " / rows=" + _count;
        BACK _text;
    }

    PUB F badge(_role) {
        IF (_role == "admin") {
            BACK this._prefix + " badge: ADMIN";
        } ELSE {
            BACK this._prefix + " badge: USER";
        }
    }
}

DECLARE _class_result = CALL ShowcaseHelper/describe(_input_name, _user_count);
DECLARE _class_badge = CALL ShowcaseHelper/badge("admin");

OUTPUT _class_result;
OUTPUT _class_badge;

LOG(_class_result);
LOG(_class_badge);

