DECLARE _final_count_before_cleanup = count_data($demo_base, $demo_table, []);
DECLARE _final_rows_before_cleanup = fetch_data($demo_base, $demo_table, []);

OUTPUT "Finale Demo-Daten vor optionalem Cleanup:";
OUTPUT _final_count_before_cleanup;
OUTPUT _final_rows_before_cleanup;

PICK * FROM users SORT uid ASC LIMIT 50;
PAGE users PAGE 1 SIZE 50;
FULLTEXT users SEARCH "demo" LIMIT 25;

