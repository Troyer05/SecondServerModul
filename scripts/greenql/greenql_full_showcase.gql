# ============================================================
# Instanz / Base / Tabelle vorbereiten
# ============================================================

DECLARE _has_instance = EXISTS INSTANCE $demo_instance;

IF (!_has_instance) {
    GROW INSTANCE gql_showcase;
    OUTPUT "Instanz wurde erstellt.";
} ELSE {
    OUTPUT "Instanz existiert bereits.";
}

USE INSTANCE gql_showcase;
ROOT INSTANCE gql_showcase;

DECLARE _has_base = EXISTS BASE $demo_base;

IF (!_has_base) {
    GROW BASE gql_showcase_main;
    OUTPUT "Base wurde erstellt.";
} ELSE {
    OUTPUT "Base existiert bereits.";
}

ROOT gql_showcase_main;

DECLARE _has_table = EXISTS TABLE $demo_table;

IF (!_has_table) {
    GROW TABLE users (uid, username, email, password, active, created_at, last_login, role, note, score);
    OUTPUT "Tabelle users wurde erstellt.";
} ELSE {
    OUTPUT "Tabelle users existiert bereits.";
}

DECLARE _has_archive_table = EXISTS TABLE $demo_archive_table;

IF (!_has_archive_table) {
    GROW TABLE users_archive (uid, username, email, password, active, created_at, last_login, role, note, score);
    OUTPUT "Archiv-Tabelle wurde erstellt.";
}

BRANCH users;

ALTER TABLE users ADD COLUMN login_count DEFAULT 0;
ALTER TABLE users ADD COLUMN tags DEFAULT "";
ALTER TABLE users ADD CONSTRAINT UNIQUE uid;
ALTER TABLE users ADD CONSTRAINT REQUIRED username;

INDEX users uid;
INDEX users username;
REINDEX users;

OUTPUT "Struktur vorbereitet.";
LOG("Struktur vorbereitet");

# ============================================================
# Transaktion mit Rollback-Test
# ============================================================

BEGIN;
SEED users WITH uid="rollback_test", username="Rollback User", email="rollback@example.test", password="x", active=false, created_at=NOW, last_login="", role="test", note="should disappear", score=0, login_count=0, tags="rollback";
ROLLBACK;

DECLARE _rollback_exists = EXISTS DATA ["uid": "rollback_test"] IN users;
OUTPUT ["rollback_test_exists": _rollback_exists];

# ============================================================
# Transaktion mit echten Demo-Daten
# ============================================================

BEGIN;

SEED users WITH uid=_seed_uid, username=_input_name, email="ada@example.test", password=_hash_sha256, active=true, created_at=_now, last_login="", role="admin", note="created by showcase", score=100, login_count=1, tags="demo,admin";
SEED users WITH uid=_second_uid, username="Grace", email="grace@example.test", password=hash("sha256", "grace-secret"), active=true, created_at=NOW, last_login="", role="dev", note="second row", score=80, login_count=2, tags="demo,dev";
SEED users WITH uid=_third_uid, username="Linus", email="linus@example.test", password=hash_sha512("linus-secret"), active=false, created_at=NOW, last_login="", role="viewer", note="inactive row", score=30, login_count=0, tags="demo,inactive";

COMMIT;

SHOW TRANSACTION;

DECLARE _user_exists = EXISTS DATA ["uid": _seed_uid] IN users;

IF (!_user_exists) {
    ERROR MSG "Showcase-Datensatz wurde nicht angelegt.";
} ELSE {
    OUTPUT "Showcase-Datensatz wurde angelegt.";
}

# ============================================================
# CRUD / Query
# ============================================================

RESHAPE users WITH username="Ada Lovelace", last_login=NOW, note="updated by RESHAPE", login_count=2 WHERE uid=_seed_uid;

PICK * FROM users WHERE active = true SORT username ASC LIMIT 10;
PICK uid, username, role, score FROM users WHERE score >= 50 SORT score DESC LIMIT 10;

EXPLAIN PICK * FROM users WHERE active = true SORT username ASC LIMIT 5;

PEEK users LIMIT 5;
DESCRIBE users;
SHOW META FROM users;
SHOW CONSTRAINTS FROM users;
SHOW INDEXES FROM users;

CHECK users;
HEALTH users;
SNAPSHOT users;
PACK users;
REPAIR users;

# ============================================================
# Advanced Engine Commands
# ============================================================

MONITOR;
MONITOR users;
MONITOR gql_showcase_main.users;

PAGE users PAGE 1 SIZE 2;
PAGE gql_showcase_main.users PAGE 1 SIZE 2;

CURSOR users SIZE 2;
CURSOR gql_showcase_main.users SIZE 2;

FULLTEXT users SEARCH "Ada" COLUMNS username,note LIMIT 10;
FULLTEXT gql_showcase_main.users SEARCH "demo" COLUMNS username,note,tags LIMIT 10;

FULLTEXT "Grace" FROM users LIMIT 10;
FULLTEXT "Ada" FROM users IN gql_showcase_main COLUMNS username,note LIMIT 10;

RECOVER users;
RECOVER gql_showcase_main.users;

