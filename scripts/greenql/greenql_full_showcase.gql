# ============================================================
# greenQLv2 Full Showcase
# ============================================================
# Ziel:
# - Möglichst viele Befehle, Runtime-Funktionen und Sprachfeatures testen
# - Eigene Demo-Instanz verwenden
# - Keine Systemdaten anfassen
# - Mehrere OUTPUT-Einträge nacheinander erzeugen
# - Logging, CRUD, Checks, Indexe, Constraints, Klassen, Funktionen,
#   Runtime-Helfer, Advanced Engine Commands und Transaktionen zeigen
# ============================================================

META = {
    "GreenQL_version": 2,
    "author": "Markus Müller / greenbucket",
    "description": "Ausführbares Showcase-Script für CRUD, Runtime, Funktionen, Klassen, Logging, Output, Transaktionen und Engine-Kommandos.",
    "return": "object",
    "params": [
        {
            "parameter": "demo_name",
            "description": "Optionaler Name für den ersten Demo-User"
        },
        {
            "parameter": "demo_password",
            "description": "Optionales Demo-Passwort"
        },
        {
            "parameter": "delete_log",
            "description": "Optional true, um die Logdatei am Ende zu löschen"
        },
        {
            "parameter": "cleanup",
            "description": "Optional true, um Demo-Tabelle/Base/Instanz am Ende zu entfernen"
        }
    ]
};

DECLARE $demo_instance = "gql_showcase";
DECLARE $demo_base = "gql_showcase_main";
DECLARE $demo_table = "users";
DECLARE $demo_archive_table = "users_archive";
DECLARE $log_file = "logs/greenql_full_showcase.log";
DECLARE $api_auth = ENV("api_auth");

DECLARE _input_name = param("demo_name");
DECLARE _input_password = param("demo_password");
DECLARE _delete_log = param("delete_log");
DECLARE _cleanup = param("cleanup");

IF (!_input_name) {
    _input_name = "Ada";
} ELSE {
    OUTPUT "Parameter demo_name wurde gesetzt.";
}

IF (!_input_password) {
    _input_password = "demo-secret";
} ELSE {
    OUTPUT "Parameter demo_password wurde gesetzt.";
}

IF (!_delete_log) {
    _delete_log = false;
}

IF (!_cleanup) {
    _cleanup = false;
}

DECLARE _now = NOW;
DECLARE _seed_uid = "u001";
DECLARE _second_uid = "u002";
DECLARE _third_uid = "u003";

OUTPUT "Showcase gestartet.";
OUTPUT _now;

SET_LOGFILE($log_file);
CLEAR_LOG();
LOG("Showcase gestartet");
LOG(["instance": $demo_instance, "base": $demo_base, "table": $demo_table, "time": _now]);

# ============================================================
# Hashing / Runtime-Basis
# ============================================================

DECLARE _hash_default = hash(_input_password);
DECLARE _hash_sha256 = hash_sha256(_input_password);
DECLARE _hash_sha512 = hash_sha512(_input_password);
DECLARE _hash_md5 = hash_md5(_input_password);
DECLARE _hash_adler32 = hash_adler32(_input_password);
DECLARE _hash_crc32 = hash_crc32(_input_password);

DECLARE _random_a = uni_random();
DECLARE _random_b = spark_id();
DECLARE _random_c = fresh_id();

OUTPUT "Hashing und IDs erzeugt.";
OUTPUT ["sha256": _hash_sha256, "sha512": _hash_sha512, "md5": _hash_md5, "adler32": _hash_adler32, "crc32": _hash_crc32];
OUTPUT ["uni_random": _random_a, "spark_id": _random_b, "fresh_id": _random_c];

LOG(["hash_default": _hash_default, "random": _random_a]);

